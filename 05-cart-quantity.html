<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>

  <body>

    <h2>Cart Quantity: <span id="quantity">0</span></h2>

    <button onclick="updateCart(1)">+1</button>
    <button onclick="updateCart(2)">+2</button>
    <button onclick="updateCart(-1)">-1</button>
    <button onclick="resetCart()">Reset</button>

    <script>
      let CartQuantity = 0;

      function updateCart(value) {
        CartQuantity += value;

        // prevent negative values
        if (CartQuantity < 0) {
          CartQuantity = 0;
        }

        updateDisplay();
      }

      function resetCart() {
        CartQuantity = 0;
        updateDisplay();
      }

      function updateDisplay() {
        document.getElementById("quantity").innerText = CartQuantity;
      }
    </script>

  </body>
</html>
